<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="TruffleTrade">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9b8"/>
      <stop offset=".5" stop-color="#e8ae52"/>
      <stop offset="1" stop-color="#9a611e"/>
    </linearGradient>
    <linearGradient id="goldDim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9973f"/>
      <stop offset="1" stop-color="#6e4514"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".54" r=".55">
      <stop offset="0" stop-color="#31443a"/>
      <stop offset="1" stop-color="#31443a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="body" cx=".36" cy=".28" r=".92">
      <stop offset="0" stop-color="#6b5843"/>
      <stop offset=".28" stop-color="#3d3126"/>
      <stop offset=".62" stop-color="#1a140d"/>
      <stop offset="1" stop-color="#060403"/>
    </radialGradient>
    <radialGradient id="sheen" cx=".3" cy=".2" r=".3">
      <stop offset="0" stop-color="#d9b078" stop-opacity=".42"/>
      <stop offset="1" stop-color="#d9b078" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bounce" cx=".6" cy=".95" r=".5">
      <stop offset="0" stop-color="#7a5a32" stop-opacity=".25"/>
      <stop offset="1" stop-color="#7a5a32" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="truffleClip">
      <path d="M256 116c64-6 124 24 152 74 26 47 26 108-2 156-30 52-84 84-150 84s-120-32-150-84c-28-48-28-109-2-156 28-50 88-80 152-74z"/>
    </clipPath>
  </defs>

  <!-- rounded dark tile: reads on any taskbar/browser tab -->
  <rect width="512" height="512" rx="112" fill="#0b110d"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>

  <!-- truffle: tight lobed silhouette -->
  <path fill="url(#body)" d="M256 116c64-6 124 24 152 74 26 47 26 108-2 156-30 52-84 84-150 84s-120-32-150-84c-28-48-28-109-2-156 28-50 88-80 152-74z"/>
  <!-- interior detail, clipped to the silhouette -->
  <g clip-path="url(#truffleClip)">
    <g opacity=".8">
      <circle cx="152" cy="196" r="66" fill="#241b12"/>
      <circle cx="356" cy="188" r="58" fill="#221910"/>
      <circle cx="360" cy="352" r="60" fill="#241b12"/>
      <circle cx="164" cy="360" r="56" fill="#1f170f"/>
      <circle cx="258" cy="430" r="48" fill="#1d150d"/>
    </g>
    <g stroke="#000" stroke-opacity=".4" fill="none" stroke-linecap="round">
      <path d="M120 268c24 16 36 44 30 74" stroke-width="8"/>
      <path d="M330 138c-14 22-17 46-10 70" stroke-width="7"/>
      <path d="M404 282c-20 15-31 39-27 66" stroke-width="7"/>
      <path d="M292 420c-20-7-44-4-64 10" stroke-width="7"/>
    </g>
    <rect width="512" height="512" fill="url(#sheen)"/>
    <rect width="512" height="512" fill="url(#bounce)"/>
  </g>

  <!-- three candlesticks set into the circumference: bearish / tall bull / bull -->
  <g stroke-linecap="round">
    <!-- upper-left rim (bearish, dim gold) -->
    <line x1="146" y1="120" x2="146" y2="240" stroke="url(#goldDim)" stroke-width="12"/>
    <rect x="132" y="148" width="28" height="64" rx="5" fill="url(#goldDim)"/>
    <!-- top (tall bullish, bright gold) -->
    <line x1="258" y1="52" x2="258" y2="188" stroke="url(#gold)" stroke-width="12"/>
    <rect x="244" y="86" width="28" height="72" rx="5" fill="url(#gold)"/>
    <!-- lower-right rim (bullish, bright gold) -->
    <line x1="370" y1="318" x2="370" y2="440" stroke="url(#gold)" stroke-width="12"/>
    <rect x="356" y="348" width="28" height="62" rx="5" fill="url(#gold)"/>
  </g>
</svg>
