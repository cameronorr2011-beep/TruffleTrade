<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="TruffleTrade">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#231a13"/>
      <stop offset="1" stop-color="#090705"/>
    </linearGradient>
    <radialGradient id="truffle" cx=".36" cy=".3" r=".8">
      <stop offset="0" stop-color="#5a4736"/>
      <stop offset=".55" stop-color="#2d221a"/>
      <stop offset="1" stop-color="#17110d"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#a8752a"/>
      <stop offset=".5" stop-color="#e8b452"/>
      <stop offset="1" stop-color="#fbe2a0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <clipPath id="clip"><rect width="240" height="240" rx="56"/></clipPath>
  </defs>

  <rect width="240" height="240" rx="56" fill="url(#bg)"/>
  <g clip-path="url(#clip)">
    <circle cx="200" cy="30" r="110" fill="#e8b452" opacity=".10" filter="url(#glow)"/>
  </g>
  <rect x="1" y="1" width="238" height="238" rx="55" fill="none" stroke="#f6d488" stroke-opacity=".16" stroke-width="2"/>

  <!-- truffle body -->
  <path d="M112 74C130 68 150 76 158 92C172 96 181 112 175 128C184 142 177 162 161 170C155 186 133 194 117 186C99 194 77 186 71 168C53 162 47 140 57 126C49 110 59 92 77 88C83 74 99 68 112 74Z" fill="url(#truffle)" stroke="#080604" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- warts / facets -->
  <g fill="#6b5543" opacity=".55">
    <circle cx="96" cy="98" r="9"/><circle cx="128" cy="92" r="7.5"/><circle cx="150" cy="118" r="8"/>
    <circle cx="84" cy="130" r="8.5"/><circle cx="118" cy="128" r="10"/><circle cx="142" cy="152" r="8"/>
    <circle cx="100" cy="162" r="9"/><circle cx="72" cy="156" r="6.5"/><circle cx="126" cy="166" r="6.5"/>
  </g>
  <g fill="none" stroke="#0b0806" stroke-opacity=".6" stroke-width="1.6">
    <circle cx="96" cy="98" r="9"/><circle cx="128" cy="92" r="7.5"/><circle cx="150" cy="118" r="8"/>
    <circle cx="84" cy="130" r="8.5"/><circle cx="118" cy="128" r="10"/><circle cx="142" cy="152" r="8"/>
    <circle cx="100" cy="162" r="9"/><circle cx="72" cy="156" r="6.5"/><circle cx="126" cy="166" r="6.5"/>
  </g>
  <path d="M84 84C96 78 108 80 116 88" fill="none" stroke="#8a7057" stroke-opacity=".5" stroke-width="3" stroke-linecap="round"/>

  <!-- trend line -->
  <path d="M40 180L86 134L112 154L150 110L168 126L204 66" fill="none" stroke="#e8b452" stroke-opacity=".45" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M40 180L86 134L112 154L150 110L168 126L204 66" fill="none" stroke="url(#gold)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M176 66L204 66L204 94" fill="none" stroke="#fbe2a0" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="40" cy="180" r="8" fill="#fbe2a0"/>
</svg>
