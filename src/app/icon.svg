<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="TruffleTrade">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe3a6"/>
      <stop offset=".5" stop-color="#e8ae52"/>
      <stop offset="1" stop-color="#8f5a1d"/>
    </linearGradient>
    <radialGradient id="t" cx=".36" cy=".3" r=".85">
      <stop offset="0" stop-color="#5b4a38"/>
      <stop offset=".45" stop-color="#221b13"/>
      <stop offset="1" stop-color="#050403"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#fafbf9"/>
  <!-- truffle body -->
  <path fill="url(#t)" d="M32 6c9-1 18 3 23 10 4 7 5 16 1 24-4 7-11 13-20 15-9 2-19 0-25-7C5 41 3 31 6 23 9 14 18 7 27 6c2 0 4 0 5 0z"/>
  <!-- warts -->
  <g fill="#000" opacity=".4">
    <circle cx="16" cy="26" r="2.6"/><circle cx="20" cy="36" r="2"/>
    <circle cx="30" cy="12" r="2"/><circle cx="44" cy="16" r="2.2"/>
    <circle cx="50" cy="30" r="2.4"/><circle cx="46" cy="44" r="2.2"/>
    <circle cx="34" cy="50" r="2"/><circle cx="20" cy="46" r="2.2"/>
    <circle cx="34" cy="22" r="1.8"/><circle cx="42" cy="36" r="2"/>
  </g>
  <!-- three candlesticks across the circumference -->
  <g stroke-linecap="round">
    <line x1="7"  y1="26" x2="7"  y2="42" stroke="url(#g)" stroke-width="2"/>
    <rect x="4.8" y="30" width="4.4" height="8" rx="1" fill="url(#g)"/>
    <line x1="32" y1="9"  x2="32" y2="24" stroke="url(#g)" stroke-width="2"/>
    <rect x="29.8" y="13" width="4.4" height="9" rx="1" fill="url(#g)"/>
    <line x1="57" y1="28" x2="57" y2="44" stroke="url(#g)" stroke-width="2"/>
    <rect x="54.8" y="32" width="4.4" height="8" rx="1" fill="url(#g)"/>
  </g>
