name: ci
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --include=dev
      - name: fail on leaked API keys
        run: |
          if grep -rInE "gsk_[A-Za-z0-9]{20,}" --exclude-dir=node_modules --exclude-dir=.next . ; then
            echo "::error::Groq API key detected in tracked files. Remove it and rotate the key."
            exit 1
          fi
          echo "no API keys found in tracked files"
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          GROQ_API_KEY: ci-placeholder
