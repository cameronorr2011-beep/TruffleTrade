name: ci
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --include=dev
      - name: secret scan (broad patterns)
        run: |
          # Fail on any credential-shaped material in tracked files (spec §60).
          PATTERNS='gsk_[A-Za-z0-9]{20,}|vcp_[A-Za-z0-9]{20,}|npg_[A-Za-z0-9]{12,}|sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{30,}|xox[baprs]-[A-Za-z0-9-]{10,}|postgres(ql)?://[^\s]+:[^\s]+@'
          HITS=$(grep -rInE "$PATTERNS" --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=.git . || true)
          if [ -n "$HITS" ]; then
            echo "::error::Credential-shaped material found in tracked files:"
            echo "$HITS"
            echo "Remove it AND rotate the credential before re-running."
            exit 1
          fi
          echo "no credential-shaped material found in tracked files"
      - name: dependency audit (prod dependencies)
        run: |
          npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          GROQ_API_KEY: ci-placeholder
